[project]
name = "ai-visuals"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "flask>=3.1.3",
    "numpy>=2.5.2",
    "opencv-python-headless>=5.0.0.93",
    "torch==2.5.1",
    "torchvision==0.20.1",
    "ultralytics>=8.4.117",
]

[project.scripts]
ai-visuals = "ai_visuals:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
